<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" id="theme-color" content="#F2F5F3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="translucent" />
    <meta name="color-scheme" content="light dark" />
<meta name="google-site-verification" content="YwQMC7LG6-tN448ZWqbLW_uE976XZ7YWzw1BNMenDPE" />
    <title>MyBalance</title>
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <link rel="apple-touch-icon" href="/assets/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            // Same system font stack used by the MyBalance app (Expo web)
            fontFamily: {
              sans: [
                "system-ui",
                "-apple-system",
                "BlinkMacSystemFont",
                "Segoe UI",
                "Roboto",
                "Helvetica",
                "Arial",
                "sans-serif",
              ],
            },
            // Semantic tokens mirror the Expo app palette; values live in the CSS variables below
            colors: {
              canvas: "rgb(var(--canvas) / <alpha-value>)",
              surface: "rgb(var(--surface) / <alpha-value>)",
              control: "rgb(var(--control) / <alpha-value>)",
              line: "rgb(var(--line) / <alpha-value>)",
              ink: "rgb(var(--ink) / <alpha-value>)",
              muted: "rgb(var(--muted) / <alpha-value>)",
              accent: "rgb(var(--accent) / <alpha-value>)",
              "on-accent": "rgb(var(--on-accent) / <alpha-value>)",
              deep: "#244437",
              income: "#298965",
              expense: "#D07862",
            },
            borderRadius: {
              panel: "26px",
              ctl: "12px",
            },
            boxShadow: {
              panel: "0 12px 30px rgba(17, 31, 24, 0.07)",
              float: "0 24px 70px rgba(6, 20, 11, 0.27)",
              control: "0 4px 12px rgba(36, 68, 55, 0.18)",
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --canvas: 242 245 243;
        --surface: 255 255 255;
        --control: 238 242 239;
        --line: 36 68 55;
        --ink: 17 24 28;
        --muted: 88 102 95;
        --accent: 36 68 55;
        --on-accent: 255 255 255;
      }
      :root.dark {
        --canvas: 23 26 24;
        --surface: 29 33 31;
        --control: 42 48 45;
        --line: 255 255 255;
        --ink: 236 237 238;
        --muted: 179 188 183;
        --accent: 214 232 222;
        --on-accent: 23 26 24;
      }
      html {
        background-color: rgb(var(--canvas));
        min-height: 100%;
        min-height: 100vh;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        background-color: rgb(var(--canvas));
        color: rgb(var(--ink));
        min-height: 100%;
        min-height: 100dvh;
        padding-bottom: env(safe-area-inset-bottom, 0);
      }
      #root {
        min-height: 100%;
        min-height: 100dvh;
        background-color: inherit;
      }
      ::selection {
        background: rgb(var(--accent) / 0.2);
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(128, 128, 128, 0.25);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(128, 128, 128, 0.4);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
          "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
          "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
          "react/": "https://esm.sh/react@^19.2.4/",
          "react": "https://esm.sh/react@^19.2.4",
          "gsap": "https://esm.sh/gsap@^3.14.2"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
    <script>
      // Update theme-color meta tag when dark mode changes
      const updateThemeColor = () => {
        const isDark = document.documentElement.classList.contains('dark');
        const themeColor = document.getElementById('theme-color');
        if (themeColor) themeColor.content = isDark ? '#171A18' : '#F2F5F3';
      };
      // Observe class changes on html element
      const observer = new MutationObserver(updateThemeColor);
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
      // Initial check
      updateThemeColor();
    </script>

</script>
